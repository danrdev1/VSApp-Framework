Screens:
  MainScreen1:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(106, 152, 53, 1)
      OnVisible: |-
        =UpdateContext({ CurrentItem: First(SortByColumns([@Concept], "Title", SortOrder.Ascending)), newMode: false })
    Children:
      - flclScreenContainer1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 248, 248, 1)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - flclTableNameContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  PaddingBottom: =10
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =10
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - flclconLibDashIdentity:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(136, 188, 65, 1)
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =4
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =4
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =220
                      Children:
                        - flclicoLibDashBook:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              Height: =32
                              Icon: =Icon.Journal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =9
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =9
                              Width: =24
                        - flclTableNameLabel1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =2
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: ="Concept Library"
                  - rectHeaderSearchSpacer:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Height: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =0
                  - flclSearchContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =Min(640, Max(180, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - 488))
                      Children:
                        - flclSearchIcon1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =RGBA(49, 114, 127, 1)
                              Height: =24
                              Icon: =Icon.Search
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              Width: =24
                        - flclSearchInput1:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Search Concept by title"
                              BorderThickness: =0
                              Color: =RGBA(35, 73, 37, 1)
                              Default: =""
                              DelayOutput: =true
                              DisplayMode: =If(newMode, DisplayMode.Disabled, DisplayMode.Edit)
                              FillPortions: =1
                              FocusedBorderThickness: =0
                              HintText: ="Search concepts…"
                              HoverBorderColor: =Self.BorderColor
                              HoverColor: =Self.Color
                              HoverFill: =Self.Fill
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10.5
                  - flclNewRecordButtonBarContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(136, 188, 65, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(136, 188, 65, 1)
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =112
                      Children:
                        - flclNewRecordAddIcon1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Add new concept"
                              Color: =RGBA(35, 73, 37, 1)
                              DisplayMode: =If(newMode, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Icon: =Icon.Add
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =ResetForm(flclForm1); UpdateContext({ newMode: true }); NewForm(flclForm1); UpdateContext({ resetConceptInputs: true }); UpdateContext({ resetConceptInputs: false })
                              PaddingBottom: =13
                              PaddingLeft: =9
                              PaddingRight: =9
                              PaddingTop: =13
                              TabIndex: =0
                              Width: =32
                        - flclNewRecordLabel1:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(35, 73, 37, 1)
                              DisplayMode: =If(newMode, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =ResetForm(flclForm1); UpdateContext({ newMode: true }); NewForm(flclForm1); UpdateContext({ resetConceptInputs: true }); UpdateContext({ resetConceptInputs: false })
                              PaddingBottom: =2
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10.5
                              Text: ="Add New"
                              Width: =78
            - flovSearchDismiss:
                Control: Rectangle@2.3.0
                Properties:
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =Max(0, Parent.Height - Self.Y)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: =Reset(flclSearchInput1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Visible: =flovConceptPopup.Visible
                  Width: =Parent.Width
                  Y: =flovConceptPopup.Y
            - flclBodyContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Max(0, App.Height - flclTableNameContainer1.Height)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  Y: =flclTableNameContainer1.Height
                Children:
                  - flclconLibDashLibraryCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(200, 200, 200, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =0.6 * Max(0, Parent.Height - Parent.PaddingTop - Parent.PaddingBottom - Parent.LayoutGap - 24)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                      Children:
                        - flclconLibDashLibraryHeading:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(248, 248, 248, 1)
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingRight: =16
                              Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                            Children:
                              - flclicoLibDashLibrary:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(106, 152, 53, 1)
                                    Height: =28
                                    Icon: =Icon.Journal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    Width: =28
                              - flcllblLibDashLibrary:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(35, 73, 37, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =2
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Concept"
                                    Width: =64
                                    Wrap: =false
                              - lblLibraryBreadcrumbSeparator:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(35, 73, 37, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =2
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =">"
                                    Width: =10
                                    Wrap: =false
                              - flcllblLibDashLibrarySource:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(49, 114, 127, 1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =2
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(newMode, "New concept", Coalesce(CurrentItem.Title, ""))
                                    Tooltip: =CurrentItem.Title
                                    Wrap: =false
                        - flcllblLibDashNoSelection:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(58, 59, 61, 1)
                              Font: =Font.'Segoe UI'
                              Height: =64
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =0
                              Size: =11.2
                              Text: ="Select a concept above, or choose Add New to create one."
                              Visible: =And(!newMode, IsBlank(CurrentItem.ID))
                        - flclForm1:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              AlignInContainer: =/* explicit form bounds */ AlignInContainer.Center
                              DataSource: =[@Concept]
                              DefaultMode: =If(newMode, FormMode.New, FormMode.View)
                              FillPortions: =0
                              Height: =Max(flclTitle_DataCard1.Height, flclNotes_DataCard1.Height) + flclAttachments_DataCard1.Height + 12
                              Item: =CurrentItem
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              NumberOfColumns: =2
                              OnFailure: =Notify("Cannot save. Please check if there are errors in the form.", NotificationType.Error)
                              OnSuccess: |-
                                =UpdateContext({ CurrentItem: Self.LastSubmit, newMode: false }); Reset(flclSearchInput1); ViewForm(flclForm1)
                              SnapToColumns: =false
                              Visible: =Or(newMode, !IsBlank(CurrentItem.ID))
                              Width: =/* explicit form bounds */ Max(240, App.Width - 72)
                            Children:
                              - flclTitle_DataCard1:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicTextualEdit
                                  IsLocked: true
                                  Properties:
                                    BorderColor: =RGBA(200, 200, 200, 1)
                                    DataField: ="Title"
                                    Default: =ThisItem.Title
                                    DisplayName: =DataSourceInfo([@Concept],DataSourceInfo.DisplayName,'Title')
                                    Height: =Max(108, flclErrorMessage1.Y + flclErrorMessage1.Height + 12)
                                    MaxLength: =DataSourceInfo([@Concept], DataSourceInfo.MaxLength, 'Title')
                                    Required: =true
                                    Update: =flclDataCardValue1.Text
                                    Width: =Max(240, App.Width - 72) / 2
                                    X: =0
                                    Y: =0
                                  Children:
                                    - flclDataCardKey1:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(58, 59, 61, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          PaddingLeft: =0
                                          Size: =11.2
                                          Text: =Parent.DisplayName
                                          Width: =Parent.Width - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =8
                                    - flclDataCardValue1:
                                        Control: Classic/TextInput@2.3.2
                                        MetadataKey: FieldValue
                                        Properties:
                                          BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                          Color: =RGBA(58, 59, 61, 1)
                                          Default: =Parent.Default
                                          DelayOutput: =true
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          DisplayMode: =Parent.DisplayMode
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =44
                                          HoverBorderColor: =RGBA(106, 152, 53, 1)
                                          HoverColor: =RGBA(58, 59, 61, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          MaxLength: =Parent.MaxLength
                                          PaddingLeft: =5
                                          PressedBorderColor: =RGBA(106, 152, 53, 1)
                                          PressedColor: =RGBA(58, 59, 61, 1)
                                          PressedFill: =RGBA(255, 255, 255, 1)
                                          Reset: =resetConceptInputs
                                          Size: =11.2
                                          Tooltip: =Parent.DisplayName
                                          Width: =flclTitle_DataCard1.Width - 48
                                          X: =24
                                          Y: =flclDataCardKey1.Y + flclDataCardKey1.Height + 4
                                    - flclErrorMessage1:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(168, 0, 0, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(168, 0, 0, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =10
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =flclDataCardValue1.Y + flclDataCardValue1.Height
                                    - flclStarVisible1:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldRequired
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(58, 59, 61, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =flclDataCardKey1.Height
                                          PaddingLeft: =0
                                          Text: ="*"
                                          Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                          Width: =30
                                          Wrap: =false
                                          Y: =flclDataCardKey1.Y
                              - flclNotes_DataCard1:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicTextualEdit
                                  IsLocked: true
                                  Properties:
                                    BorderColor: =RGBA(200, 200, 200, 1)
                                    DataField: ="Notes"
                                    Default: =ThisItem.Notes
                                    DisplayName: =DataSourceInfo([@Concept],DataSourceInfo.DisplayName,'Notes')
                                    Height: =Max(156, flclErrorMessage2.Y + flclErrorMessage2.Height + 12)
                                    MaxLength: =DataSourceInfo([@Concept], DataSourceInfo.MaxLength, 'Notes')
                                    Required: =false
                                    Update: =flclDataCardValue2.Text
                                    Width: =Max(240, App.Width - 72) / 2
                                    X: =1
                                    Y: =0
                                  Children:
                                    - flclDataCardKey2:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(58, 59, 61, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          PaddingLeft: =0
                                          Size: =11.2
                                          Text: =Parent.DisplayName
                                          Width: =Parent.Width - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =8
                                    - flclDataCardValue2:
                                        Control: Classic/TextInput@2.3.2
                                        MetadataKey: FieldValue
                                        Properties:
                                          BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                          Color: =RGBA(58, 59, 61, 1)
                                          Default: =Parent.Default
                                          DelayOutput: =true
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          DisplayMode: =Parent.DisplayMode
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =86
                                          HoverBorderColor: =RGBA(106, 152, 53, 1)
                                          HoverColor: =RGBA(58, 59, 61, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          MaxLength: =Parent.MaxLength
                                          Mode: =TextMode.MultiLine
                                          PaddingLeft: =5
                                          PressedBorderColor: =RGBA(106, 152, 53, 1)
                                          PressedColor: =RGBA(58, 59, 61, 1)
                                          PressedFill: =RGBA(255, 255, 255, 1)
                                          Reset: =resetConceptInputs
                                          Size: =11.2
                                          Tooltip: =Parent.DisplayName
                                          Width: =flclNotes_DataCard1.Width - 48
                                          X: =24
                                          Y: =flclDataCardKey2.Y + flclDataCardKey2.Height + 4
                                    - flclErrorMessage2:
                                        Control: Label@2.5.1
                                        MetadataKey: ErrorMessage
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(168, 0, 0, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(168, 0, 0, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =10
                                          Live: =Live.Assertive
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =10
                                          Text: =Parent.Error
                                          Visible: =Parent.DisplayMode=DisplayMode.Edit
                                          Width: =Parent.Width - 48
                                          X: =24
                                          Y: =flclDataCardValue2.Y + flclDataCardValue2.Height
                              - flclAttachments_DataCard1:
                                  Control: TypedDataCard@1.0.7
                                  Variant: ClassicAttachmentsEdit
                                  IsLocked: true
                                  Properties:
                                    BorderColor: =RGBA(200, 200, 200, 1)
                                    DataField: ="{Attachments}"
                                    Default: =ThisItem.Attachments
                                    DisplayName: =DataSourceInfo([@Concept],DataSourceInfo.DisplayName,'{Attachments}')
                                    Height: =Max(148, flclErrorMessage3.Y + flclErrorMessage3.Height + 12)
                                    Required: =false
                                    Update: =flclDataCardValue3.Attachments
                                    Width: =Max(240, App.Width - 72)
                                    X: =0
                                    Y: =1
                                  Children:
                                    - flclDataCardKey3:
                                        Control: Label@2.5.1
                                        MetadataKey: FieldName
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =2
                                          Color: =RGBA(58, 59, 61, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          PaddingLeft: =0
                                          Size: =11.2
                                          Text: =Parent.DisplayName
                                          Width: =Parent.Width - 48
                                          Wrap: =false
                                          X: =24
                                          Y: =8
                                    - flclDataCardValue3:
                                        Control: Attachments@2.3.0
                                        MetadataKey: FieldValue
                                        Properties:
                                          BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                          BorderStyle: =BorderStyle.None
                                          Color: =RGBA(58, 59, 61, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          DisplayMode: =Parent.DisplayMode
                                          Font: =Font.'Segoe UI'
                                          Height: =88
                                          HoverColor: =RGBA(58, 59, 61, 1)
                                          HoverFill: =RGBA(255, 255, 255, 1)
                                          ItemColor: =RGBA(0, 0, 0, 1)
                                          ItemFill: =RGBA(106, 152, 53, 1)
                                          ItemHoverColor: =RGBA(58, 59, 61, 1)
                                          ItemHoverFill: =RGBA(255, 255, 255, 1)
                                          ItemSpacing: =12
                                          Items: =Parent.Default
                                          NoAttachmentsColor: =RGBA(161, 159, 157, 1)
                                          PaddingBottom: =5
                                          PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                                          PaddingRight: =5
                                          PaddingTop: =5
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(106, 152, 53, 1)
                                          Reset: =resetConceptInputs
